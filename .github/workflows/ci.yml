name: macOS checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Regression tests
        run: bash test.sh
      - name: Universal build
        run: bash build.sh
      - name: Verify architectures and signature
        run: |
          lipo build/NearClip.app/Contents/MacOS/NearClip -verify_arch arm64 x86_64
          codesign --verify --deep --strict build/NearClip.app
